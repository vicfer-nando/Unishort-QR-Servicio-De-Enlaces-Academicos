server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El frontend estático tampoco debe registrar IP ni parámetros de URL.
    access_log off;
    error_log /dev/null;

    # Los módulos del panel necesitan un MIME JavaScript para el navegador.
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
