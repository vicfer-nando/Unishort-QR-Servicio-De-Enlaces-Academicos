project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "paquete/*.qmd"
  resources:
    - sources/**
    - diagrams/**

website:
  title: "UniShort QR"
  description: "Portal técnico del incremento de la Evaluación Sumativa 1"
  navbar:
    left:
      - href: index.qmd
        text: Inicio
      - href: api.qmd
        text: API
      - href: administracion.qmd
        text: Administración
      - href: paquete/README.qmd
        text: Entrega EVA
    right:
      - href: https://github.com/vicfer-nando/Unishort-QR-Servicio-De-Enlaces-Academicos
        text: Repositorio
  sidebar:
    style: docked
    contents:
      - index.qmd
      - requisitos.qmd
      - arquitectura.qmd
      - procesos.qmd
      - api.qmd
      - administracion.qmd
      - seguridad.qmd
      - pruebas.qmd
      - despliegue.qmd
      - evolucion.qmd
      - contribuciones.qmd
      - entrega.qmd
      - auditoria.qmd
      - section: Dossier final
        contents:
          - paquete/README.qmd
          - paquete/matriz-rubrica-final.qmd
          - paquete/guion-demostracion.qmd
          - paquete/evidencias-capturas.qmd
          - paquete/evidencias-automaticas.qmd
          - paquete/contribuciones-individuales.qmd
          - paquete/declaracion-uso-ia.qmd
          - paquete/instrucciones-reproduccion.qmd
          - paquete/publicacion-quarto.qmd
          - paquete/integracion-y-checklist.qmd
          - paquete/resultados-verificacion.qmd
          - paquete/texto-entrega-eva.qmd

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    lang: es
    code-copy: true
    code-overflow: wrap
    css: styles.css

execute:
  enabled: false
