name: Calidad del backend
on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pytest tests --cov=backend/app --cov-report=term-missing
      - run: python -m ruff check backend tests alembic scripts
      - run: python -m ruff format --check backend tests alembic scripts
      - run: python -m mypy backend/app
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify_frontend.mjs
      - run: node --test tests/js/admin.test.mjs
      - run: python scripts/render_portal.py --prepare-only
      - run: python scripts/verify_docs.py --allow-unrendered-diagrams
