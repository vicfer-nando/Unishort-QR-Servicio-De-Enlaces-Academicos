[project]
name = "unishort-qr"
version = "1.0.0"
description = "Servicio académico de acortamiento de enlaces y códigos QR"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "SQLAlchemy==2.0.35",
    "alembic==1.13.3",
    "qrcode[pil]==8.0",
    "Pillow==12.3.0",
    "python-multipart==0.0.12",
]

[project.optional-dependencies]
dev = [
    "httpx==0.27.2",
    "pytest==9.1.1",
    "pytest-cov==5.0.0",
    "opencv-python-headless==4.10.0.84",
    "ruff==0.6.9",
    "mypy==1.11.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-q"

[tool.coverage.run]
source = ["backend/app"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
